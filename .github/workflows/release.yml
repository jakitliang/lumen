name: 发布 Lumen

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: lumen-linux
            asset_name: lumen-linux.tar.gz
            compress_cmd: tar -czvf
          - os: windows-latest
            artifact_name: lumen-windows
            asset_name: lumen-windows.zip
            compress_cmd: 7z a -tzip
          - os: macos-latest
            artifact_name: lumen-macos
            asset_name: lumen-macos.tar.gz
            compress_cmd: tar -czvf
          
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    
    - name: 配置 CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
      
    - name: 构建
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: 打包 (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p ${{github.workspace}}/dist/bin
        cp ${{github.workspace}}/build/src/lumen ${{github.workspace}}/dist/bin/
        cp -r ${{github.workspace}}/lib ${{github.workspace}}/dist/
        cp ${{github.workspace}}/LICENSE ${{github.workspace}}/dist/
        cp ${{github.workspace}}/README*.md ${{github.workspace}}/dist/
        cd ${{github.workspace}}
        ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} dist
        
    - name: 打包 (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir -p ${{github.workspace}}/dist/bin
        cp ${{github.workspace}}/build/src/Release/lumen.exe ${{github.workspace}}/dist/bin/
        cp -r ${{github.workspace}}/lib ${{github.workspace}}/dist/
        cp ${{github.workspace}}/LICENSE ${{github.workspace}}/dist/
        cp ${{github.workspace}}/README*.md ${{github.workspace}}/dist/
        cd ${{github.workspace}}
        ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} dist
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ github.workspace }}/${{ matrix.asset_name }}
        
  create-release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: 下载所有构建产物
      uses: actions/download-artifact@v3
    
    - name: 创建发布
      uses: softprops/action-gh-release@v1
      with:
        files: |
          lumen-linux/lumen-linux.tar.gz
          lumen-windows/lumen-windows.zip
          lumen-macos/lumen-macos.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 