name: 发布 Lumen

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: lumen-linux
            asset_name: lumen-linux.tar.gz
            compress_cmd: tar -czvf
          - os: windows-latest
            artifact_name: lumen-windows
            asset_name: lumen-windows.zip
            compress_cmd: 7z a -tzip
          - os: macos-latest
            artifact_name: lumen-macos
            asset_name: lumen-macos.tar.gz
            compress_cmd: tar -czvf
          
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    
    - name: 安装依赖 (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libreadline-dev libncurses-dev
        
    - name: 安装依赖 (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install readline ncurses
    
    - name: 配置 CMake (非Windows)
      if: matrix.os != 'windows-latest'
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release
      
    - name: 配置 CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: cmake -B "${{github.workspace}}\build" -DCMAKE_BUILD_TYPE=Release

    - name: 构建 (非Windows)
      if: matrix.os != 'windows-latest'
      run: cmake --build ${{github.workspace}}/build --config Release
      
    - name: 构建 (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: cmake --build "${{github.workspace}}\build" --config Release
    
    - name: 检查构建目录 (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        ls -la ${{github.workspace}}/build/src/
        
    - name: 检查构建目录 (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        ls -la ${{github.workspace}}/build/src/
        
    - name: 检查构建目录 (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        dir "${{github.workspace}}\build\src\"
        dir "${{github.workspace}}\build\src\lumen\"
        echo 检查其他可能的位置:
        if exist "${{github.workspace}}\build\src\Release\" (
          dir "${{github.workspace}}\build\src\Release\"
        ) else (
          echo Release 目录不存在
        )
        echo 查找可执行文件:
        dir /s /b "${{github.workspace}}\build\*.exe"
    
    - name: 打包 (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p ${{github.workspace}}/dist/bin
        # 如果 lumen 是目录，复制整个目录内容
        if [ -d "${{github.workspace}}/build/src/lumen" ]; then
          cp -r ${{github.workspace}}/build/src/lumen/* ${{github.workspace}}/dist/bin/
        # 否则如果是文件，直接复制
        elif [ -f "${{github.workspace}}/build/src/lumen" ]; then
          cp ${{github.workspace}}/build/src/lumen ${{github.workspace}}/dist/bin/
        # 否则查找 lumen 可执行文件
        else
          find ${{github.workspace}}/build -name "lumen" -type f -executable -exec cp {} ${{github.workspace}}/dist/bin/ \;
          # 如果找不到，尝试复制所有可执行文件
          if [ ! "$(ls -A ${{github.workspace}}/dist/bin/)" ]; then
            find ${{github.workspace}}/build -type f -executable -exec cp {} ${{github.workspace}}/dist/bin/ \;
          fi
        fi
        cp -r ${{github.workspace}}/lib ${{github.workspace}}/dist/
        cp ${{github.workspace}}/LICENSE ${{github.workspace}}/dist/
        cp ${{github.workspace}}/README*.md ${{github.workspace}}/dist/
        cd ${{github.workspace}}
        ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} dist
        
    - name: 打包 (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        mkdir -p ${{github.workspace}}/dist/bin
        # 如果 lumen 是目录，复制整个目录内容
        if [ -d "${{github.workspace}}/build/src/lumen" ]; then
          cp -r ${{github.workspace}}/build/src/lumen/* ${{github.workspace}}/dist/bin/
        # 否则如果是文件，直接复制
        elif [ -f "${{github.workspace}}/build/src/lumen" ]; then
          cp ${{github.workspace}}/build/src/lumen ${{github.workspace}}/dist/bin/
        # 否则查找 lumen 可执行文件
        else
          find ${{github.workspace}}/build -name "lumen" -type f -perm +111 -exec cp {} ${{github.workspace}}/dist/bin/ \;
          # 如果找不到，尝试复制所有可执行文件
          if [ ! "$(ls -A ${{github.workspace}}/dist/bin/)" ]; then
            # macOS 上使用不同的权限检查
            find ${{github.workspace}}/build -type f -perm +111 -exec cp {} ${{github.workspace}}/dist/bin/ \;
          fi
        fi
        cp -r ${{github.workspace}}/lib ${{github.workspace}}/dist/
        cp ${{github.workspace}}/LICENSE ${{github.workspace}}/dist/
        cp ${{github.workspace}}/README*.md ${{github.workspace}}/dist/
        cd ${{github.workspace}}
        ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} dist
        
    - name: 打包 (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        mkdir "${{github.workspace}}\dist\bin"
        
        REM 尝试不同位置的 lumen.exe
        IF EXIST "${{github.workspace}}\build\src\lumen\lumen.exe" (
          copy "${{github.workspace}}\build\src\lumen\lumen.exe" "${{github.workspace}}\dist\bin\"
        ) ELSE IF EXIST "${{github.workspace}}\build\src\lumen\*.exe" (
          copy "${{github.workspace}}\build\src\lumen\*.exe" "${{github.workspace}}\dist\bin\"
        ) ELSE IF EXIST "${{github.workspace}}\build\src\Release\lumen.exe" (
          copy "${{github.workspace}}\build\src\Release\lumen.exe" "${{github.workspace}}\dist\bin\"
        ) ELSE IF EXIST "${{github.workspace}}\build\src\lumen.exe" (
          copy "${{github.workspace}}\build\src\lumen.exe" "${{github.workspace}}\dist\bin\"
        ) ELSE (
          REM 如果找不到明确的位置，则搜索
          for /R "${{github.workspace}}\build" %%i in (*.exe) do copy "%%i" "${{github.workspace}}\dist\bin\"
        )
        
        xcopy /E /I "${{github.workspace}}\lib" "${{github.workspace}}\dist\lib"
        copy "${{github.workspace}}\LICENSE" "${{github.workspace}}\dist\"
        copy "${{github.workspace}}\README*.md" "${{github.workspace}}\dist\"
        cd "${{github.workspace}}"
        ${{ matrix.compress_cmd }} ${{ matrix.asset_name }} dist
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ github.workspace }}/${{ matrix.asset_name }}
        
  create-release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: 下载所有构建产物
      uses: actions/download-artifact@v4
    
    - name: 创建发布
      uses: softprops/action-gh-release@v1
      with:
        files: |
          lumen-linux/lumen-linux.tar.gz
          lumen-windows/lumen-windows.zip
          lumen-macos/lumen-macos.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 